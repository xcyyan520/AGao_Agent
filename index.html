<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>边说边出题 · 原型</title>
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1e222b; --line:#2a2f3a;
    --fg:#e6e9ef; --dim:#8b94a7; --dim2:#5f6779;
    --ok:#3fb950; --err:#f85149; --vague:#d29922; --off:#a371f7; --unc:#58a6ff;
    --accent:#2f81f7;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--fg);
    font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    display:flex; flex-direction:column; overflow:hidden;
  }
  header{
    padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel);
    display:flex; align-items:center; gap:12px; flex-wrap:wrap; flex:0 0 auto;
  }
  header h1{font-size:15px; margin:0; font-weight:600; letter-spacing:.3px}
  .pill{
    font-size:11px; padding:2px 8px; border-radius:20px;
    background:var(--panel2); color:var(--dim); border:1px solid var(--line);
  }
  .pill.live{color:var(--ok); border-color:#1f4d29}
  .pill.warn{color:var(--vague); border-color:#4d3d1f}
  /* 空状态的 pill 不显示：否则页头会挂着两个光秃秃的「—」，
     在窄屏上还会把标题挤到第二行。有内容时才让它出现。 */
  .pill:empty{display:none}
  /* 模型 pill 里装的是「模型名 @ 完整 baseUrl」，字符串很长。
     不限宽的话，它在 360px 的手机上会自己换行折成两行（实测 332×41），
     把整个 header 撑到 184px 高——连带 .stream 只剩 187px 可用高度，
     内容溢出画到侧栏上，把「记录并提问」盖住（实测被 #btnMatLib 遮挡）。
     这里强制单行 + 省略号，把它压回 24px 一行。 */
  #modelPill{
    max-width:min(260px, 46vw); overflow:hidden; text-overflow:ellipsis;
    white-space:nowrap; vertical-align:middle;
  }
  .grow{flex:1}
  button{
    background:var(--panel2); color:var(--fg); border:1px solid var(--line);
    padding:6px 12px; border-radius:6px; cursor:pointer; font-size:13px; font-family:inherit;
    transition:.15s;
  }
  button:hover:not(:disabled){background:#262b36; border-color:#3a4150}
  button:disabled{opacity:.4; cursor:not-allowed}
  button.primary{background:var(--accent); border-color:var(--accent); color:#fff; font-weight:500}
  button.primary:hover:not(:disabled){background:#1f6feb}
  button.danger{color:var(--err); border-color:#4d2426}
  /* 小号按钮：塞在 h2 里或列表项里，不能把行高撑开 */
  button.mini{
    padding:1px 7px; font-size:11px; border-radius:4px; font-weight:400;
    text-transform:none; letter-spacing:0;
  }
  .side h2 button.mini{float:right; margin-top:-2px}

  /* ── 材料库 ──
     侧栏只有 320px 宽，列表必须能滚，不能把整条侧栏撑长。
     max-height 卡在 180px：够看见四五份材料，再多就滚。 */
  .lib{
    margin-top:8px; border:1px solid var(--line); border-radius:6px;
    background:var(--bg); overflow:hidden;
  }
  .lib-head{
    display:flex; align-items:center; gap:8px; padding:6px 8px;
    font-size:11px; color:var(--dim); border-bottom:1px solid var(--line);
  }
  .lib-head span{flex:1}
  .lib-list{max-height:180px; overflow-y:auto}
  .lib-item{
    padding:7px 8px; border-bottom:1px solid var(--line); cursor:pointer;
    font-size:12px; display:flex; align-items:center; gap:8px;
  }
  .lib-item:last-child{border-bottom:none}
  .lib-item:hover{background:var(--panel2)}
  .lib-item .nm{flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .lib-item .ch{font-size:11px; color:var(--dim2)}
  .lib-item .del{
    font-size:11px; color:var(--dim2); padding:0 4px; border-radius:3px; flex:0 0 auto;
  }
  .lib-item .del:hover{color:var(--err); background:#2a1a1c}
  .lib-empty{padding:10px 8px; font-size:12px; color:var(--dim2)}

  /* ── 弹层（历史面试）──
     手机上也用它，所以宽度用 min() 卡住，不能写死像素。 */
  .modal{
    position:fixed; inset:0; background:rgba(0,0,0,.62); z-index:50;
    display:flex; align-items:center; justify-content:center; padding:16px;
    backdrop-filter:blur(2px);
  }
  .modal-box{
    background:var(--panel); border:1px solid var(--line); border-radius:10px;
    width:min(560px,100%); max-height:80vh; display:flex; flex-direction:column;
    box-shadow:0 16px 48px rgba(0,0,0,.55); overflow:hidden;
  }
  .modal-head{
    display:flex; align-items:center; gap:8px; padding:10px 12px;
    border-bottom:1px solid var(--line);
  }
  .modal-head h2{font-size:13px; margin:0; flex:1; font-weight:600}
  .modal-foot{padding:8px 12px; border-top:1px solid var(--line); display:flex; gap:8px; align-items:center}
  .hist-item{padding:9px 12px; border-bottom:1px solid var(--line); cursor:pointer}
  .hist-item:hover{background:var(--panel2)}
  .hist-item .top{display:flex; align-items:baseline; gap:8px; margin-bottom:3px}
  .hist-item .ttl{flex:1; font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hist-item .when{font-size:11px; color:var(--dim2); flex:0 0 auto}
  .hist-item .meta{font-size:11px; color:var(--dim2); display:flex; gap:10px; flex-wrap:wrap}
  .hist-item .qs{margin-top:5px; font-size:12px; color:var(--dim); line-height:1.5}
  .hist-item .qs div{overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
  .hist-item .acts{margin-top:6px; display:flex; gap:6px}
  .notice{text-align:center; font-size:12px; color:var(--dim2); padding:6px 4px}
  .saidblock .why{font-size:11.5px; color:var(--dim2); margin-top:4px}

  main{flex:1; display:flex; min-height:0}

  /* 左：材料 + 控制 */
  .side{
    width:320px; flex:0 0 320px; border-right:1px solid var(--line);
    background:var(--panel); display:flex; flex-direction:column; min-height:0;
    /* overflow-y:auto 是必须的，不能靠默认的 visible。
       窄屏时 .side 被 max-height 压住，而两段 section 的最低高度之和大于这个
       上限；visible 会让超出的内容直接盖到下一段上（实测「保存材料」和
       「语速」两行叠在一起）。auto 让它变成滚动。 */
    overflow-y:auto;
  }
  .side section{padding:12px; border-bottom:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
  .side h2{
    font-size:12px; margin:0 0 8px; color:var(--dim); font-weight:600;
    text-transform:uppercase; letter-spacing:.6px;
  }
  textarea{
    width:100%; background:var(--bg); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:8px; font:12px/1.5 ui-monospace,Consolas,monospace;
    resize:vertical; font-family:ui-monospace,Consolas,monospace;
  }
  textarea:focus{outline:none; border-color:var(--accent)}
  .row{display:flex; gap:8px; align-items:center; flex-wrap:wrap}
  .row.mt{margin-top:8px}
  input[type=text],input[type=password],input[type=number]{
    background:var(--bg); color:var(--fg); border:1px solid var(--line);
    border-radius:6px; padding:6px 8px; font-size:12px; font-family:inherit;
  }
  input:focus{outline:none; border-color:var(--accent)}
  label.f{font-size:11px; color:var(--dim); display:block; margin-bottom:3px}
  .field{margin-bottom:8px}

  /* 右：出题流 */
  .stream{flex:1; display:flex; flex-direction:column; min-width:0; min-height:0}
  .qbar{
    padding:10px 14px; border-bottom:1px solid var(--line); background:var(--panel);
    display:flex; gap:8px; align-items:center; flex:0 0 auto;
  }
  .qbar input{flex:1}
  .feed{flex:1; overflow-y:auto; padding:12px 14px; display:flex; flex-direction:column; gap:10px}
  .feed::-webkit-scrollbar{width:8px}
  .feed::-webkit-scrollbar-thumb{background:#333a47; border-radius:4px}

  /* ── 下一个问题：这是整个界面的主角，不再是一堆判断卡片 ──
     字号刻意放大到 17px：面试官是在听人说话的间隙扫一眼，
     不是坐着读文章。扫不到就等于没出。 */
  .nextq{
    margin:12px 14px 0; padding:12px 14px; border-radius:10px; flex:0 0 auto;
    background:linear-gradient(180deg,#16202e,#141922);
    border:1px solid #2a3f5a;
  }
  .nextq.ready{
    border-color:#2f6b3a;
    background:linear-gradient(180deg,#152318,#141922);
  }
  .nextq .nq-head{display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap}
  .nextq .nq-title{
    font-size:11px; letter-spacing:.8px; color:var(--dim); font-weight:600;
    text-transform:uppercase;
  }
  .nextq .nq-grow{flex:1}
  .nextq .nq-q{
    font-size:17px; line-height:1.5; font-weight:600; color:var(--fg);
    min-height:26px; word-break:break-word;
  }
  .nextq .nq-q.wait{color:var(--dim2); font-weight:400; font-size:14px}
  .nextq .nq-meta{
    font-size:12.5px; color:var(--dim); margin-top:8px;
    display:flex; flex-direction:column; gap:3px;
  }
  .nextq .nq-meta .k{color:var(--dim2); margin-right:6px}
  .nextq .lat{font:11px ui-monospace,monospace; color:var(--dim2)}
  .nq-cursor{animation:b .8s step-end infinite; color:var(--accent)}
  @keyframes b{50%{opacity:0}}

  .badge{font-size:11px; font-weight:600; padding:1px 8px; border-radius:4px; flex:0 0 auto}
  .badge.probe{background:#122a45; color:var(--unc)}
  .badge.fresh{background:#2a1d43; color:var(--off)}
  .badge.wrap{background:#12351c; color:var(--ok)}

  /* 候选人说的话：按「一段回答」累积成一块。
     不能每切一块就多一个方块——面试官看的是他讲了什么，不是切块器的输出。 */
  .saidblock{
    font-size:13.5px; color:var(--dim); line-height:1.75;
    border-left:2px solid #2a3f5a; padding:4px 0 4px 10px;
    white-space:pre-wrap; word-break:break-word; animation:in .18s ease-out;
  }
  /* 面试官说的话：换个颜色和左边线。
     两个人的话在同一个流里，光靠内容分不出哪句是问的。 */
  .saidblock.q{
    color:var(--fg); border-left-color:#5a4a2a; background:rgba(255,180,80,.04);
    border-radius:0 4px 4px 0; padding-right:8px;
  }
  .saidblock .who{
    display:inline-block; font-size:10.5px; font-weight:600; letter-spacing:.4px;
    color:var(--dim2); margin-right:8px; padding:1px 5px;
    background:rgba(255,255,255,.05); border-radius:3px; vertical-align:1px;
  }
  .saidblock.q .who{color:#c9a25a; background:rgba(255,180,80,.1)}
  /* AI 建议的题：和「面试官说的话」必须视觉可分。
     它们长得像（都是一句问话），但性质完全不同——一个是真问出口的，
     一个是备选。混在一起看历史，就分不清哪句真的发生了。 */
  .saidblock.sugg{
    color:var(--dim); border-left-color:#2f4a6a; background:rgba(120,180,255,.04);
    border-radius:0 4px 4px 0; padding-right:8px;
  }
  .saidblock.sugg .who{color:var(--accent); background:rgba(120,180,255,.12)}
  @keyframes in{from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none}}

  /* 出题历史：一行一条，事后能回看 AI 到底建议过什么 */
  .qlog{
    display:flex; gap:8px; align-items:baseline; font-size:12.5px;
    border-left:2px solid var(--line); padding:2px 0 2px 8px; color:var(--dim);
  }
  .qlog .t{font:11px ui-monospace,monospace; color:var(--dim2); flex:0 0 auto}
  .qlog .qq{color:var(--fg); flex:1; word-break:break-word}

  .empty{color:var(--dim2); text-align:center; padding:40px 20px; font-size:13px; line-height:1.9}
  .stats{
    padding:8px 14px; border-top:1px solid var(--line); background:var(--panel);
    display:flex; gap:16px; font:11px ui-monospace,Consolas,monospace; color:var(--dim);
    flex-wrap:wrap; flex:0 0 auto;
  }
  .stats b{color:var(--fg); font-weight:600}
  @media(max-width:900px){
    main{flex-direction:column}
    /* 侧栏在矮屏上「滚动」而不是「溢出」。
       之前 .side 是 overflow:visible，max-height 压住后两段 section 的内容
       直接盖到一起（实测「保存材料」和「语速」两行叠在同一个位置）。
       不给 section / textarea 设立固定高度——那会在 900px 附近把两段
       挤到互相覆盖，是修一个 bug 引入另一个。 */
    .side{
      width:auto; flex:0 0 auto; max-height:42vh; min-height:0;
      border-right:none; border-bottom:1px solid var(--line);
      overflow-y:auto;
    }
    /* 手机上把出题区放到最上面。面试进行中最该一直看到的是「下一个问题」，
       而材料框和回放按钮是准备动作。不调顺序的话，手机上要先滚过材料和
       回放控件才看得到题——那"尽早"两个字就白写了。 */
    .stream{order:1}
    .side{order:2}

    /* .stream 里的 .feed 自己会滚，但 .nextq / .qbar / .stats 是定高。
       如果 .stream 的盒子比这几块之和小，它们会溢出画到下面的 .side 上
       （实测 360×640 下 .stream 拿到 187px 却要装 307px，溢出的 120px
       正好盖住 .side 顶部的「材料库」按钮，把「记录并提问」挡死）。
       overflow:hidden 在这里是兜底：宁可切掉也不能让两块内容叠在一起。 */
    .stream{overflow:hidden}

    /* 窄屏上页头要省着用。实测 360px 宽时 header 一开始占 184px（五行），
       压掉 modelPill 和 padding 之后是 131px（三行）。
       模型名不是每分钟都要看的东西——设置面板里有完整值，这里只留图标性的
       提示，把高度还给「下一个问题」。 */
    header{padding:7px 10px; gap:8px}
    header h1{font-size:13px}
    #modelPill{display:none}
    .nextq{margin:8px 10px 0; padding:9px 11px}
    .qbar{padding:7px 10px}
  }

  /* ── 麦克风 ──
     整块区域就一个按钮，所以按钮要够大：手机上是拇指点的，
     面试进行中不该出现「点偏了没点上，以为坏了」这种事。 */
  .micbtn{
    width:100%; padding:13px 12px; font-size:14px; font-weight:600;
    border-radius:8px; margin-top:2px;
  }
  .micbtn.on{
    background:#3a1414; border-color:#5e2020; color:#ff8f8f;
    animation:micpulse 1.6s ease-in-out infinite;
  }
  @keyframes micpulse{50%{box-shadow:0 0 0 4px rgba(255,90,90,.13)}}
  /* 正在说的话：等宽行高，字进来时不会把下面的东西顶得跳。
     中间结果一秒变好几次，跳一下人就分不清哪句是新的。 */
  .micshow{
    font-size:13px; line-height:1.6; color:var(--dim); margin-top:8px;
    min-height:20px; max-height:76px; overflow:hidden;
    word-break:break-word; white-space:pre-wrap;
  }
  .micshow:empty{display:none}
  .hint{font-size:11.5px; color:var(--dim2); line-height:1.65; margin-top:8px}
  .hint b{color:var(--dim); font-weight:600}
</style>
</head>
<body>

<header>
  <h1>边说边出题</h1>
  <span class="pill" id="connPill">连接中…</span>
  <span class="pill" id="modelPill"></span>
  <div class="grow"></div>
  <span class="pill" id="progPill" title="AI 根据他说的话出了几次题。次数追上块数就说明跟得上"></span>
  <button id="btnSettings">⚙ 设置</button>
  <button id="btnHist">历史面试</button>
  <button id="btnSummary">导出复盘</button>
  <button id="btnReset" class="danger">重置</button>
</header>

<!-- 历史面试：以前面过几场、每场出了哪些题。
     这是「AI 记得你之前面过」的可见部分——不然那个记忆是黑盒的。 -->
<div id="histWrap" class="modal" style="display:none">
  <div class="modal-box">
    <div class="modal-head">
      <h2>历史面试</h2>
      <button id="btnHistClose" class="mini">关闭</button>
    </div>
    <div id="histList" class="lib-list" style="max-height:60vh">加载中…</div>
    <div class="modal-foot">
      <span id="histStat" class="pill"></span>
    </div>
  </div>
</div>

<main>
  <aside class="side">
    <!-- 关键：材料区可以「长大」，但不能被「压扁」。
         它原来是 flex:1 1 auto，是 flex 列里唯一的可伸缩项；高度不够时会被
         压到比内容还矮，而里面 textarea 的 min-height:120px 压不下去，内容
         于是溢出到下一段上——实测「模拟候选人说话」和「保存材料 / 0 字」
         两行叠在同一个位置。
         现在改成 flex:1 1 auto + min-height（按内容算出的下限），配合 .side
         的 overflow-y:auto：够高就撑满，不够高就整条滚动，绝不重叠。 -->
    <section style="flex:1 1 auto; min-height:236px">
      <h2>面试材料（出题的依据）
        <button id="btnMatLib" class="mini" title="从存过的材料里挑一份，不用再粘一次">材料库</button>
      </h2>
      <textarea id="materials" style="flex:1 1 auto; min-height:120px"
        placeholder="把候选人的逐字稿、项目资料粘进来。&#10;&#10;AI 出题的依据就是这里。&#10;不填的话它只能顺着他的话表面往下问，问不到『和他自己材料对不上』这类最有价值的地方。"></textarea>
      <!-- 材料库：解决「每次都要自己复制粘贴」。
           默认收起来，不占本来就不宽的侧栏。 -->
      <div id="matLib" class="lib" style="display:none">
        <div class="lib-head">
          <span>存的材料（点一下装载）</span>
          <button id="btnMatLibClose" class="mini">收起</button>
        </div>
        <div id="matLibList" class="lib-list">加载中…</div>
      </div>
      <div class="row mt" style="flex:0 0 auto">
        <button id="btnSaveMat">保存材料</button>
        <span class="pill" id="matStat">0 字</span>
      </div>
    </section>

    <!-- ── 说话（麦克风） ──
         这一块是主路径：点一下开始，再点一下暂停。
         回放收在下面（点「模拟回放」展开），因为要复现问题、要演示、
         要在没法开麦的地方试功能，都得靠它。
         不做长按：面试里手要用来记笔记，长按是反人类的。 -->
    <section id="micSec">
      <h2>说话
        <span class="pill" id="micWho">我是面试者</span>
        <button id="btnRole" class="mini" title="切换这台设备代表谁：候选人 / 面试官。两个人各开一台，各点各的。">切换</button>
        <button id="btnReplayOpen" class="mini" title="没有麦克风时用这个：把文字按真人语速喂进去">模拟回放</button>
      </h2>
      <button id="btnMic" class="micbtn">开始说话</button>
      <div class="micshow" id="micShow"></div>
      <div class="hint" id="micHint">
        <b>两个人各开一台设备</b>，各自点「切换」选好自己是谁，再点「开始说话」。<br>
        面试官说的话进右边「你实际问出口的问题」，候选人说的话喂给 AI 出题。<br>
        第一次点会要麦克风权限，允许一下。
      </div>
    </section>

    <section id="replaySec" style="display:none">
      <h2>模拟回放
        <button id="btnReplayClose" class="mini">收起</button>
      </h2>
      <textarea id="replayText" style="height:88px"
        placeholder="粘一段真实面试回答。点『开始回放』后，它会按真人语速（约 4 字/100ms）逐字喂进去，模拟边说边出题。"></textarea>
      <div class="row mt">
        <label class="f" style="margin:0">语速</label>
        <input type="number" id="cps" value="4" min="1" max="12" style="width:56px">
        <span class="pill">字/100ms</span>
        <div class="grow"></div>
      </div>
      <!-- 「开始回放 / 停止」单独一行：和「语速 4 字/100ms」挤在一行时，
           320px 宽的侧栏放不下，两个按钮会被折到第二行显得很乱。 -->
      <div class="row mt">
        <button id="btnReplay" class="primary" style="flex:1">▶ 开始回放</button>
        <button id="btnStop" disabled style="flex:0 0 auto">■ 停止</button>
      </div>
    </section>

    <section id="settings" style="display:none">
      <h2>模型设置</h2>
      <div class="field"><label class="f">Base URL</label>
        <input type="text" id="cfgBase" style="width:100%"></div>
      <div class="field"><label class="f">模型名</label>
        <input type="text" id="cfgModel" style="width:100%"></div>
      <div class="field"><label class="f">API Key（只发给本地服务，不落盘）</label>
        <input type="password" id="cfgKey" style="width:100%" placeholder="留空则用启动时的环境变量"></div>
      <div class="row"><button id="btnSaveCfg" class="primary">应用</button>
        <span class="pill" id="cfgStat"></span></div>
    </section>
  </aside>

  <div class="stream">
    <!-- 常驻在顶部：下一个问题。它随候选人说话不断被重写；
         等他停下来的时候，这里已经有一道题等着了——这就是"尽早"。 -->
    <div class="nextq" id="nextq">
      <div class="nq-head">
        <span class="nq-title">下一个问题</span>
        <span class="pill" id="nqState">还没开始</span>
        <span class="nq-grow"></span>
        <span class="lat" id="nqMs"></span>
      </div>
      <div class="nq-q wait" id="nqQ">点左边的「开始说话」，题目就会跟着来。</div>
      <div class="nq-meta" id="nqMeta"></div>
    </div>

    <div class="qbar">
      <input type="text" id="question" placeholder="面试官实际问出口的问题（点麦克风说话会自动写进来，也可以手打）">
      <button id="btnAsk" class="primary">记录并提问</button>
    </div>

    <div class="feed" id="feed">
      <div class="empty" id="emptyHint">
        还没有内容。<br>
        点左边的「开始说话」，<br>
        上面就会跟着他的话出下一道题。
      </div>
    </div>

    <div class="stats">
      <span>已听 <b id="stChunks">0</b> 块</span>
      <span>已出题 <b id="stApplied">0</b> 次</span>
      <span>合并 <b id="stMerged">0</b> 次</span>
      <span>首字 p50 <b id="stFirst">—</b></span>
      <span>整轮 p50 <b id="stP50">—</b></span>
      <span>p90 <b id="stP90">—</b></span>
      <span>回答 <b id="stMem">0</b> 字</span>
    </div>
  </div>
</main>

<script>
const $ = id => document.getElementById(id);
const SESSION = new URLSearchParams(location.search).get('s') || 'default';

/* ── 出题类型的中文名 ── */
const TYPE_LABEL = { probe:'追问', fresh:'新方向', wrap:'收尾' };

/* 进度显示用：把"第几块"还原成"面试者的第几句话"。
   块号是给机器看的，面试官看的是候选人说到第几句了。 */
const CN = n => {
  const d = ['零','一','二','三','四','五','六','七','八','九'];
  if(n <= 10) return n === 10 ? '十' : d[n];
  if(n < 20) return '十' + d[n-10];
  return String(n);
};

let saidEl = null;       // 候选人这一段回答累积在哪个元素里
let nqSeq = -1;          // 顶部面板上这条建议对应的块号
let gotDraft = false;    // 这一块的问题是否已经提前上屏过

/* 面试官说的话各自成段，和候选人的回答按角色分开记。
   只保留 interviewer 这一个键：候选人那一路走 appendSaid（切块事件）。
   两路都画会重复——见 appendLine 上面的说明。 */
const saidBlockEl = { interviewer: null };
let lineCount = 0;       // 轮询已经画过多少条对话流，用来做增量补行

/* 已经完整画进面板的最大块号（只增不减）。
   注意 draft 不抬这个数：draft 只画了问题那一行，理由/依据还没到，
   要是它把水位抬上去，轮询就不会再来补全那一条了。
   抬水位的只有 showNext（整轮结束）。 */
let ceilSeq = -1;
/* 上一轮轮询看到的历史条数。只增不减，用它跳过重复的补行工作。 */
let histLen = -1;
/* SSE 当前是不是通的。不通时页面靠 2 秒轮询拿题——
   手机走 Cloudflare 快速隧道时，SSE 大多是「连得上但收不到数据」，
   这时它就是唯一的上屏通道。 */
let esOpen = false;

/* ── 事件流 ── */
/* SSE 断了以后 EventSource 会自己重连，但重连成功与否最晚要等下一次
   onopen/onerror 才知道。轮询那边靠 esOpen 判断该不该接管，
   所以这里给一个「多久没消息就算不通」的保守兜底。

   ★ 为什么光靠 onopen 不够（踩过，很难查）：
   Cloudflare 快速隧道会对响应体做缓冲，表现是一种**静默失败**——
   HTTP 头正常回来，onopen 照常触发，页面显示「已连接」，
   但 body 里一条 data: 都送不到，而且 onerror 永远不触发。
   结果就是：连接状态一片绿，题目却一个都不出，人以为 AI 坏了。

   所以判据不能是「连上了没有」，必须是「**最近有没有真的收到东西**」。
   服务端每 5 秒发一条 `{type:'hb'}` 事件（前端不拿它做业务，只用它刷新
   存活时间），这里盯的是「多久没收到过任何消息」。 */
let lastMsgAt = 0;
const SSE_STALE_MS = 14000;   // 服务端 5 秒一次心跳，14 秒没动静就判不通

/* 标记 SSE 不通：切到轮询，并把状态如实写出来。
   注意文案不能写成「断线」——线其实连着，是数据过不来，
   写「断线」会让人去查网络，而真正该做的是等轮询补上。 */
function markOffline(){
  if(!esOpen) return;          // 已经是离线态，别反复改 DOM
  esOpen = false;
  $('connPill').textContent = '改用轮询';
  $('connPill').className = 'pill warn';
  $('connPill').title = '这个网络下 SSE 连得上但数据过不来（Cloudflare 快速隧道就是这样）。题目改由每 2 秒一次的轮询送上屏，最多慢 2 秒，功能不缺。';
}

function connect(){
  const es = new EventSource(`/events?s=${encodeURIComponent(SESSION)}`);

  es.onopen = () => {
    esOpen = true;
    lastMsgAt = Date.now();
    $('connPill').textContent = '已连接';
    $('connPill').className = 'pill live';
  };
  es.onerror = () => {
    esOpen = false;
    $('connPill').textContent = '断线，改用轮询';
    $('connPill').className = 'pill warn';
    $('connPill').title = '这个网络不走 SSE（Cloudflare 快速隧道就是这样）。题目改由每 2 秒一次的轮询送上屏，最多慢 2 秒，不影响用。';
  };

  es.onmessage = ev => {
    lastMsgAt = Date.now();
    if(!esOpen){                 // 之前被判死、现在又来数据了：活过来了
      esOpen = true;
      $('connPill').textContent = '已连接';
      $('connPill').className = 'pill live';
    }
    let m; try { m = JSON.parse(ev.data); } catch { return; }
    handle(m);
  };
}

/* 每 3 秒看一眼：连上了却一直没数据 → 判死，让轮询接管。
   这个检查必须独立于 refreshState（那个有两秒节奏，而且失败时静默）。 */
setInterval(() => {
  if(esOpen && lastMsgAt && Date.now() - lastMsgAt > SSE_STALE_MS) markOffline();
}, 3000);

function handle(m){
  switch(m.type){
    case 'chunk':
      // 一块被切出来了，先把它接到候选人"正在说"的那段话后面
      appendSaid(m.text);
      break;

    case 'judging':
      // 这一块的推理开始了。别让面板还停在上一题上让人误会。
      showThinking(m);
      break;

    case 'draft':
      // 问题那一行先从流里出来了 —— 立刻上屏，不等理由
      showDraft(m);
      break;

    case 'nextq':
      showNext(m);
      break;

    case 'merged':
      flash(`AI 没跟上语速，已把第 ${CN(m.from[0])}、${CN(m.from[1])} 块合并后一起出题（内容没丢）`);
      break;

    case 'stale':
      // 迟到结果本来就不该覆盖新结果，是设计行为，不必打扰面试官
      break;

    case 'question':
      addNotice(`— 你实际问出口了：${esc(m.question)} —`);
      resetPanel();
      break;

    case 'judge_error':
      addNotice(`出题失败：${esc(m.message)}`, true);
      setState('出题失败', 'warn');
      break;

    case 'replay_end':
      $('btnReplay').disabled = false;
      $('btnStop').disabled = true;
      addNotice(m.aborted ? '回放已中止。' : '回放结束。');
      refreshState();
      break;

    case 'hb':
      // 心跳。onmessage 已经把 lastMsgAt 刷新了，这里什么都不用做；
      // 列出来是为了让读代码的人知道这个 type 是有意忽略的，不是漏了。
      break;

    case 'asr_line':
      // 面试官说了一句完整的（候选人的话走 chunk 事件，见 appendLine 说明）
      appendLine(m, m.replay);
      break;

    case 'asr_live':
      // 还没定稿的中间结果。只显示，不进对话流、不进切块器。
      showLive(m.role, m.text);
      break;

    case 'asr_state':
      if(m.state === 'error'){
        addNotice(`识别出错：${esc(m.message || '未知')}`, true);
        if(m.role === myRole) { micRunning = false; syncMicUI(); }
      } else if(m.state === 'closed' || m.state === 'stopped'){
        if(m.role === myRole && micRunning){ micRunning = false; syncMicUI(); }
      }
      break;
  }
}

/* ── 渲染 ── */
function esc(s){
  return String(s ?? '').replace(/[&<>"']/g, c =>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function hideEmpty(){ const e = $('emptyHint'); if(e) e.remove(); }

/* 候选人说的话按「一段回答」累积成一块。
   不能每切一块就在屏幕上多一个方块——面试官要看的是他讲了什么，
   不是切块器的输出。切块是给 AI 用的，不是给他看的。 */
function appendSaid(text){
  hideEmpty();
  // 面试官插话之后，候选人下一句要另起一块（appendLine 会把它标 closed）
  if(!saidEl || saidEl.dataset.closed === '1'){
    saidEl = document.createElement('div');
    saidEl.className = 'saidblock';
    $('feed').appendChild(saidEl);
  }
  saidEl.textContent += text;
  scroll();
}

function setState(txt, cls){
  const p = $('nqState');
  p.textContent = txt;
  p.className = 'pill' + (cls ? ' ' + cls : '');
}

/* 这一块的推理开始了。只有在这一块还没提前上屏过的时候才把状态压回
   「正在想」——否则会把刚显示出来的问题又盖掉。 */
function showThinking(m){
  if(nqSeq !== m.seq){ nqSeq = m.seq; gotDraft = false; }
  if(!gotDraft) setState('正在想…', 'warn');
}

/* ── 关键的一步 ──
   问题那一行刚从模型的流里出来就先上屏，不等「理由 / 依据」生成完。
   省下的这一段，正是面试官最需要的时间：候选人还在说，他已经能读到题了。 */
function showDraft(m){
  if(!m.question || m.seq < nqSeq) return;
  hideEmpty();
  gotDraft = true;
  nqSeq = m.seq;
  $('nqQ').textContent = m.question;
  $('nqQ').className = 'nq-q';
  $('nqMeta').innerHTML =
    '<span class="nq-cursor">▌</span> <span style="color:var(--dim2)">理由还在生成…</span>';
  $('nextq').className = 'nextq ready';
  setState('题已出，可以先看', 'live');
  scroll();
}

/* 整轮推理结束：补齐类型 / 理由 / 依据，并把这条建议记进历史 */
function showNext(m){
  hideEmpty();
  if(m.question && m.seq >= nqSeq){
    gotDraft = true;
    nqSeq = m.seq;
    $('nqQ').textContent = m.question;
    $('nqQ').className = 'nq-q';
    $('nextq').className = 'nextq ready';
    $('nqMeta').innerHTML =
      `<div><span class="k">理由</span>${esc(m.reason || '—')}</div>` +
      (m.basis ? `<div><span class="k">依据</span>${esc(m.basis)}</div>` : '');
    $('nqMs').textContent = m.ms != null ? m.ms + 'ms' : '';
    setState(TYPE_LABEL[m.kind] || '建议', m.kind === 'wrap' ? 'live' : '');
  } else if(!m.question){
    // 模型没给出可用的问题（格式崩了）：如实说，不要装作没事
    setState('这一块没出题', 'warn');
  }
  // 已经定稿的块号：轮询靠它判断面板要不要换题，所以只有走到这一支才抬。
  if(m.question && m.seq > ceilSeq) ceilSeq = m.seq;
  if(m.question && !document.getElementById('qlog-' + m.seq)){
    // 按 seq 去重：SSE 断开重连时服务端会把整段历史补发一遍，
    // 不去重屏幕上就会出现两行一模一样的问题，面试官会以为 AI 问重复了。
    const d = document.createElement('div');
    d.className = 'qlog';
    d.id = 'qlog-' + m.seq;
    d.innerHTML =
      `<span class="t">第${CN(m.seq)}块</span>` +
      `<span class="badge ${m.kind || 'probe'}">${TYPE_LABEL[m.kind] || '建议'}</span>` +
      `<span class="qq">${esc(m.question)}</span>` +
      (m.replay ? '<span class="pill">历史</span>' : '');
    $('feed').appendChild(d);
    scroll();
  }
  // 立刻刷新统计，别让「已出题 N 次」在最长 2 秒里和上面的历史行数对不上——
  // 面试官会盯着这个数判断 AI 跟不跟得上，它自相矛盾比慢一点更伤信任。
  if(!m.replay) refreshState();
}

/* 面试官问出了新问题：上一条建议已经过期，面板回到等待态，
   同时从他这一句开始的回答要另起一块。 */
function resetPanel(){
  /* 注意 ceilSeq 故意不在这里归零。它记的是「AI 已经定稿到第几块」，
     和面板现在摆的是哪一题无关；归零的话 2 秒后的轮询会立刻把上一题
     重新顶回面板，看起来就像 AI 又推荐了一遍同一道题。 */
  nqSeq = -1;
  gotDraft = false;
  $('nqQ').textContent = '等他说完这一段，我会跟着他的话出下一道题。';
  $('nqQ').className = 'nq-q wait';
  $('nqMeta').innerHTML = '';
  $('nqMs').textContent = '';
  $('nextq').className = 'nextq';
  setState('等下一块');
  saidEl = null;
}

function addNotice(text, isErr){
  const d = document.createElement('div');
  d.style.cssText = 'text-align:center; font-size:12px; padding:4px; color:' +
    (isErr ? 'var(--err)' : 'var(--dim2)');
  d.textContent = text;
  $('feed').appendChild(d);
  scroll();
}

let flashEl = null;
function flash(msg){
  if(!flashEl){
    flashEl = document.createElement('div');
    flashEl.style.cssText =
      'font-size:12px; color:var(--vague); text-align:center; padding:4px; transition:opacity .4s';
    $('feed').appendChild(flashEl);
  }
  flashEl.textContent = msg;
  clearTimeout(flashEl._t);
  flashEl._t = setTimeout(() => { flashEl.style.opacity = '0'; }, 2500);
}

function scroll(){
  const f = $('feed');
  // 只有当用户已经在底部附近时才自动滚动，否则会打断往上翻的人
  const near = f.scrollHeight - f.scrollTop - f.clientHeight < 120;
  if(near) f.scrollTop = f.scrollHeight;
}

/* ── 轮询兜底 ──
   题目原本只走 SSE。可有些网络环境下 SSE 根本走不通——最典型的就是
   Cloudflare 快速隧道（官方明确不支持），手机从外面连进来时表现为：
   页面能开、统计数字每 2 秒在跳，但「下一个问题」永远停在初始文案，
   看起来就像这个功能坏了。
   所以每次轮询都顺带看一眼 /api/state 里的 history：SSE 通的时候它什么
   都不做（面板早就跟上来了），SSE 不通的时候它就是唯一的上屏通道，
   代价最多是题目晚 2 秒出现。 */
const BACKFILL_MAX = 30;   // 首次最多往回补多少条日志，长面试能攒到几十条

function pollBackfill(history){
  const items = (history || []).filter(r => r && r.question);
  if(!items.length) return;

  // 会话被重置过，历史缩水了：当作全新一场重新补
  if(items.length < histLen) histLen = -1;

  if(histLen < 0){
    // 第一次拿到历史。手机刚打开页面时日志是空的，面试官会以为之前
    // 什么都没出过，所以把这一段补上并标成「历史」；只补最后
    // BACKFILL_MAX 条，再往前的翻也翻不到。
    const from = Math.max(0, items.length - BACKFILL_MAX);
    for(let i = from; i < items.length; i++) showNext({ ...items[i], replay: true });
  } else if(items.length > histLen){
    // SSE 漏掉了几条（通道不通，或者中途断过）。这几条刚出炉，不标历史。
    for(let i = histLen; i < items.length; i++) showNext({ ...items[i] });
  }
  histLen = items.length;

  /* 面板该不该换题：看有没有「已经定稿、但从来没上过面板」的那一条。
     这里用 ceilSeq 而不是 nqSeq —— 面试官问出新问题时 resetPanel() 会把
     nqSeq 打回 -1，要是拿它做判据，轮询马上会把上一题又顶回面板，
     面试官会以为 AI 在重复推荐。ceilSeq 只涨不跌，正好避开这个。 */
  const last = items[items.length - 1];
  if(last.seq > ceilSeq) showNext({ ...last });
}

/* ── 状态刷新 ── */
async function refreshState(){
  try{
    const s = await (await fetch(`/api/state?s=${encodeURIComponent(SESSION)}`)).json();
    const heard = s.stats.chunks || 0;
    const made = (s.history || []).length;

    pollBackfill(s.history);
    // 对话流也补：手机走隧道时 SSE 不通，面试官说的话只能靠这里上屏
    pollLines(s.transcript);
    /* 服务端已经在替我这个角色听的时候，把按钮显示成「正在说话」。
       典型场景：这台设备刷新了页面——麦克风停了，但服务端那一路还开着，
       按钮却显示「开始说话」，人会再点一次，等于开了第二路。
       只在本地确实没在采集时才跟随（micStream 为空即没采集）。 */
    if(!micStream && s.asr){
      const on = s.asr[myRole] === 'listening';
      if(on !== micRunning){ micRunning = on; syncMicUI(); }
    }

    $('stChunks').textContent = heard;
    $('stApplied').textContent = made;
    $('stMerged').textContent = s.stats.merged;
    $('stMem').textContent = (s.answer || '').length;

    /* AI 落后多少块：这是整个方案最该被盯着的一个数。
       它一旦持续为正并且越来越大，说明模型跟不上这个人说话的语速，
       面试官就会在候选人说完之后才开始等题——那就白做了。 */
    const behind = heard - made;
    $('progPill').textContent = `已出题 ${made} 次`;
    $('progPill').className = 'pill' + (behind > 2 ? ' warn' : (heard && behind <= 0 ? ' live' : ''));
    $('progPill').title = behind > 0
      ? `AI 还有 ${behind} 块没出题（正在合并追进度）`
      : (heard ? 'AI 跟得上，没有积压' : '还没开始');

    const pctOf = arr => p => {
      if(!arr || !arr.length) return '—';
      const a = [...arr].sort((x,y)=>x-y);
      return a[Math.min(a.length-1, Math.floor(a.length*p))] + 'ms';
    };
    $('stFirst').textContent = pctOf(s.stats.draftLatency)(.5);
    $('stP50').textContent = pctOf(s.stats.latency)(.5);
    $('stP90').textContent = pctOf(s.stats.latency)(.9);

    $('modelPill').textContent = s.conf.model + ' @ ' + s.conf.baseUrl.replace(/^https?:\/\//,'');
  }catch(_){}
}

/* ── 材料库 ──
   解决「每次都要自己复制粘贴」。材料存在服务端的 SQLite 里，
   换台设备、换个浏览器都还在。 */
async function loadMatLib(){
  const list = $('matLibList');
  list.textContent = '加载中…';
  try{
    const j = await (await fetch('/api/materials/list')).json();
    const items = j.items || [];
    if(!items.length){
      list.innerHTML = '<div class="lib-empty">还没有存过材料。把内容粘到上面，点「保存材料」。</div>';
      return;
    }
    list.innerHTML = '';
    for(const m of items){
      const d = document.createElement('div');
      d.className = 'lib-item';
      d.innerHTML =
        `<span class="nm" title="${esc(m.name)}">${esc(m.name)}</span>` +
        `<span class="ch">${m.chars} 字</span>` +
        `<span class="del" title="从材料库删掉">✕</span>`;
      // 点名字 = 装载到当前会话（不覆盖文本框以外的任何状态）
      d.querySelector('.nm').onclick = () => useMaterial(m.id, m.name);
      d.onclick = e => { if(e.target.classList.contains('nm')) return; useMaterial(m.id, m.name); };
      d.querySelector('.del').onclick = async e => {
        e.stopPropagation();
        if(!confirm(`从材料库删掉「${m.name}」？\n（不影响正在进行的这场面试）`)) return;
        await fetch('/api/materials/delete', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body: JSON.stringify({ id: m.id })
        });
        loadMatLib();
      };
      list.appendChild(d);
    }
  }catch(e){
    list.innerHTML = '<div class="lib-empty">材料库读不出来，服务可能没起。</div>';
  }
}

async function useMaterial(id, name){
  const r = await fetch('/api/materials/use', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ session:SESSION, id })
  });
  const j = await r.json();
  if(!j.ok) return flash('装载失败：' + (j.error || '未知原因'));
  // 把正文拉回来填进文本框，让人看得见到底装了哪份。
  const g = await (await fetch('/api/materials/get?id=' + id)).json();
  $('materials').value = g.material.text;
  // 材料库里的正文永远是完整的，这里显示的是**装进去之后**实际生效的字数。
  // 超上限时两者不一样，得说清楚是哪一种情况。
  $('matStat').textContent = j.chars + ' 字';
  if (j.dropped) $('matStat').textContent += ` · 超出 ${j.dropped} 字已省略`;
  $('matLib').style.display = 'none';
  flash(j.dropped
    ? `已装载「${name}」，但超上限，只用前 ${j.chars} 字`
    : `已装载「${name}」`);
}

/* ── 历史面试 ──
   以前面过几场、每场出了哪些题。这一层存在的理由不只是「回顾」：
   跨场记忆需要让人能看见、能管理。看不到的记忆等于没有。 */
async function loadHist(){
  const list = $('histList');
  list.textContent = '加载中…';
  try{
    const j = await (await fetch('/api/sessions?limit=30')).json();
    // 这里**不能把当前场次过滤掉**。试过，结果是：只有一个会话的人在
    // 「历史面试」里看到一片空白，会以为这个功能坏了。把本场也列出来、
    // 带上「本场」标记，既说明它是什么，也不藏东西。
    const items = j.items || [];
    if(!items.length){
      list.innerHTML = '<div class="lib-empty">还没有面试记录。这场跑起来之后就会出现在这里。</div>';
      return;
    }
    list.innerHTML = '';
    let totalQ = 0;
    for(const s of items){
      totalQ += s.suggestions || 0;
      const d = document.createElement('div');
      d.className = 'hist-item';
      const when = new Date(s.updated_at || s.started_at).toLocaleString('zh-CN', {
        month:'2-digit', day:'2-digit', hour:'2-digit', minute:'2-digit'
      });
      const ttl = s.title || s.material_name || s.id;
      const isCur = s.id === SESSION;
      d.innerHTML =
        `<div class="top"><span class="ttl" title="${esc(String(ttl))}">${esc(String(ttl))}</span>` +
        (isCur ? `<span class="pill live">本场</span>` : '') +
        `<span class="when">${esc(when)}</span></div>` +
        `<div class="meta"><span>${s.suggestions || 0} 道题</span>` +
        `<span>${s.turns || 0} 次提问</span>` +
        `<span>${s.lines || 0} 句对话</span>` +
        (s.material_name ? `<span>材料：${esc(s.material_name)}</span>` : '') +
        `</div><div class="qs">点一下展开这一场出过的题</div>` +
        `<div class="acts"><button class="mini" data-act="load">加载这场</button></div>`;
      // 展开才拉题目列表：30 场一次性全拉会把接口拖慢
      d.onclick = async (ev) => {
        /* 「加载这场」和「展开题目」是两件事，别让点击冒泡上去把面板收掉。
           加载 = 把这一场的对话流 + 出过的题完整还原到左边的对话面板，
           效果就是「回到那场面试结束时的样子」。 */
        if(ev.target.dataset.act === 'load'){
          ev.stopPropagation();
          await loadSessionIntoView(s.id, ev.target);
          return;
        }
        const qs = d.querySelector('.qs');
        if(d.dataset.open === '1'){
          qs.innerHTML = '点一下展开这一场出过的题';
          d.dataset.open = '0';
          return;
        }
        d.dataset.open = '1';
        try{
          const g = await (await fetch('/api/sessions/get?id=' + encodeURIComponent(s.id))).json();
          // 只显示真有文字的那些，空题（格式崩了）不占行
          const list2 = (g.suggestions || []).filter(r => r.question);
          qs.innerHTML = list2.length
            ? list2.map(r => `<div>· ${esc(r.question)}</div>`).join('')
            : '<div>（这场没有记录到题目）</div>';
        }catch(e){ qs.innerHTML = '<div>读取失败</div>'; }
      };
      list.appendChild(d);
    }
    $('histStat').textContent = `共 ${items.length} 场 · ${totalQ} 道题`;
  }catch(e){
    list.innerHTML = '<div class="lib-empty">读不出来，服务可能没起。</div>';
  }
}

/* ── 把一场历史面试还原到左边面板 ──
   要还原三样东西：两个人说的话、AI 出过的题、面试官真问过的题。
   为什么不在服务端「切到那一场」——因为那是破坏性的：切过去之后
   这一场就变成了活跃会话，紧接着录的音会混进去。这里只做只读还原，
   当前场次一个字都不动。 */
async function loadSessionIntoView(id, btn){
  const old = btn ? btn.textContent : '';
  if(btn){ btn.disabled = true; btn.textContent = '加载中…'; }
  try{
    const g = await (await fetch('/api/sessions/get?id=' + encodeURIComponent(id))).json();
    if(!g.ok) throw new Error('读不出来');

    const feed = $('feed');
    feed.innerHTML = '';
    saidEl = null;
    saidBlockEl.interviewer = null;
    flashEl = null;   // 它刚才挂在旧的 feed 上，已经被 innerHTML 清掉了

    const lines = g.lines || [];
    const head = document.createElement('div');
    head.className = 'empty';
    head.textContent = `以下是「${g.session?.title || g.session?.id || id}」的记录，` +
      `${lines.length} 句对话 · ${(g.suggestions || []).length} 道建议 · ${(g.turns || []).length} 次提问。只读。`;
    feed.appendChild(head);

    // 对话流：面试官的按「一问」起块，候选人的按「一段」累积
    for(const l of lines){
      if(l.role === 'interviewer'){
        const el = document.createElement('div');
        el.className = 'saidblock q';
        const who = document.createElement('span');
        who.className = 'who';
        who.textContent = '面试官';
        el.appendChild(who);
        el.appendChild(document.createTextNode(l.text));
        feed.appendChild(el);
        if(saidEl) saidEl.dataset.closed = '1';
      }else{
        if(!saidEl || saidEl.dataset.closed === '1'){
          saidEl = document.createElement('div');
          saidEl.className = 'saidblock';
          feed.appendChild(saidEl);
        }
        saidEl.textContent += l.text;
      }
    }
    saidEl = null;

    // AI 出过的题，按顺序铺开
    const sugg = (g.suggestions || []).filter(r => r.question);
    if(sugg.length){
      const d = document.createElement('div');
      d.className = 'notice';
      d.textContent = `— 这场 AI 一共出过 ${sugg.length} 道题 —`;      feed.appendChild(d);
      for(const r of sugg){
        const el = document.createElement('div');
        /* 建议用独立类，不要复用 .q（面试官）。
           第一版就是复用的，结果「还原出的对话里有面试官」这项检查
           被建议块蒙过去了——明明那场没有提问，检查却是绿的。 */
        el.className = 'saidblock sugg';
        const who = document.createElement('span');
        who.className = 'who';
        who.textContent = `建议 · ${r.kind || ''} ${r.ms ? r.ms + 'ms' : ''}`.trim();
        el.appendChild(who);
        el.appendChild(document.createTextNode(r.question));
        if(r.reason){
          const rz = document.createElement('div');
          rz.className = 'why';
          rz.textContent = '理由：' + r.reason;
          el.appendChild(rz);
        }
        feed.appendChild(el);
      }
    }

    $('histWrap').style.display = 'none';
    scroll();
    flash(`已加载「${g.session?.title || id}」，${lines.length} 句对话。这是只读回放，不会影响当前这场。`);
  }catch(e){
    flash('加载失败：' + e.message);
  }finally{
    if(btn){ btn.disabled = false; btn.textContent = old || '加载这场'; }
  }
}

/* ══════════════════════════════════════════════════════════════
   麦克风：把浏览器听到的声音变成文字
   ══════════════════════════════════════════════════════════════

   为什么不用浏览器的 Web Speech API：
   它（Chrome 的 webkitSpeechRecognition）看着零成本，但两个硬伤要命——
   ① 只认一个麦克风，没法让面试官和候选人各用一台设备分别识别；
   ② 它的中间结果是「整句重写」，而且不告诉你哪句是最终的，
      拿它往切块器里灌会把同一句话反复累积（这是接真实 ASR 最容易踩的坑，
      在接阿里云之前就在代码注释里记过一次）。
   所以走服务端：这里只负责采集 PCM 往上传，识别和分句都在服务端做。

   采样率必须降到 16000：阿里云要求 PCM 16k / 16bit / 单声道。
   浏览器的 AudioContext 一般是 48k，所以要用 OfflineAudioContext 转。
   ── 为什么不用 MediaRecorder：它只给 webm/opus，服务端还得解码，
      在 Node 里没有内置解码器，等于要多一个依赖。PCM 是裸的，谁都读得懂。 */

/* 这台设备代表谁。两个人各开一台，各自选自己的角色。
   存在 localStorage 里：刷新页面、锁屏再回来，不该又变回默认值。 */
let myRole = localStorage.getItem('micRole') === 'interviewer' ? 'interviewer' : 'candidate';

let micStream = null;    // MediaStream
let micCtx = null;       // AudioContext
let micNode = null;      // ScriptProcessor
let micSink = null;      // 零音量 Gain，把图捋顺（见 startMic 里的说明）
let micRunning = false;
let micSending = 0;      // 还在飞的 /api/asr/feed 请求数，用来做背压
let micPending = [];     // 攒着还没发的 PCM 块
let micTimer = null;     // 定时冲积压音频的兜底（见 startMic 结尾）

const MIC_RATE = 16000;
const MIC_CHUNK_MS = 250;        // 多久发一次音频
const MIC_MAX_INFLIGHT = 4;      // 同时最多几个在途请求：网差时宁可攒着，也不要把内存灌爆

/* 降采样到 16k 并转成 16bit 小端 PCM。
   ★ 必须经过一个真滤波器，不能直接每 3 个点取 1 个：
     48k→16k 直接抽样会把 8k 以上的声音「折叠」回可听频段（混叠），
     表现为识别结果里冒出莫名其妙的字，很难查。
     OfflineAudioContext 走的是浏览器的正经重采样，顺手就把滤波做了。 */
async function toPcm16k(float32, srcRate){
  const off = new OfflineAudioContext(1, Math.ceil(float32.length * MIC_RATE / srcRate), MIC_RATE);
  const buf = off.createBuffer(1, float32.length, srcRate);
  buf.copyToChannel(float32, 0);
  const src = off.createBufferSource();
  src.buffer = buf;
  src.connect(off.destination);
  src.start();
  const rendered = await off.startRendering();
  const f = rendered.getChannelData(0);

  const out = new DataView(new ArrayBuffer(f.length * 2));
  for(let i = 0; i < f.length; i++){
    // 夹一下再转：超出 [-1,1] 的样本直接乘 32767 会绕回成反相的噪音
    const v = Math.max(-1, Math.min(1, f[i]));
    out.setInt16(i * 2, v < 0 ? v * 0x8000 : v * 0x7fff, true);
  }
  return out.buffer;
}

async function flushMic(){
  if(!micPending.length || !micRunning) return;
  if(micSending >= MIC_MAX_INFLIGHT) return;   // 等下一次 timer 再试

  // 把攒着的几块合成一个请求发。发得碎会顶到浏览器单域名的连接数上限，
  // 识别就会断断续续。
  const parts = micPending; micPending = [];
  const body = new Blob(parts);
  micSending++;
  try{
    await fetch(`/api/asr/feed?s=${encodeURIComponent(SESSION)}&role=${myRole}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/octet-stream' },
      body
    });
  }catch(_){
    // 发失败就是丢这 250ms 的音。不重试：重发会让音频错位，
    // 识别结果对不上时间轴，比丢一点更糟。
  }finally{
    micSending--;
  }
}

async function startMic(){
  if(micRunning) return;
  $('btnMic').disabled = true;
  try{
    micStream = await navigator.mediaDevices.getUserMedia({
      audio: {
        channelCount: 1,
        // 这三个开关很关键：
        // 回声消除：否则面试官那台设备会从扬声器听到候选人，重复识别
        // 降噪：键盘声、风扇声进去会变成零碎的字
        // 自动增益：说话有远有近，不加它远处的句子会识别不出来
        echoCancellation: true,
        noiseSuppression: true,
        autoGainControl: true
      }
    });

    // 先在服务端开好 WS，再开始送音频。反过来的话开头几百毫秒会被丢掉。
    const r = await fetch('/api/asr/start', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ session: SESSION, role: myRole })
    });
    const j = await r.json();
    if(!j.ok) throw new Error(j.error || '服务端开不了识别');

    micCtx = new (window.AudioContext || window.webkitAudioContext)();
    // 手机浏览器上 AudioContext 默认是 suspended，要显式 resume，
    // 否则 ScriptProcessor 一次都不回调，表现为「点了开始但一句话都没有」。
    if(micCtx.state === 'suspended') await micCtx.resume();

    const source = micCtx.createMediaStreamSource(micStream);
    micNode = micCtx.createScriptProcessor(4096, 1, 1);
    micSink = micCtx.createGain();
    micSink.gain.value = 0;   // 不静音的话会从扬声器里听到自己的声音（啸叫）

    const pendingBuf = [];
    let pendingLen = 0;
    const need = Math.round(MIC_RATE * MIC_CHUNK_MS / 1000);

    micNode.onaudioprocess = async e => {
      if(!micRunning) return;
      const input = e.inputBuffer.getChannelData(0);
      // 转码是异步的，这里必须立刻复制一份：inputBuffer 会被浏览器复用，
      // 不复制的话等 await 回来，数组里的内容已经是别的时刻了。
      const copy = new Float32Array(input);
      pendingBuf.push(copy);
      pendingLen += copy.length;
      if(pendingLen < micCtx.sampleRate * MIC_CHUNK_MS / 1000) return;

      const merged = new Float32Array(pendingLen);
      let off = 0;
      for(const b of pendingBuf){ merged.set(b, off); off += b.length; }
      pendingBuf.length = 0; pendingLen = 0;

      micPending.push(await toPcm16k(merged, micCtx.sampleRate));
      flushMic();
    };

    source.connect(micNode);
    micNode.connect(micSink);
    micSink.connect(micCtx.destination);   // 必须连到 destination 才会被驱动，哪怕音量是 0

    micRunning = true;
    syncMicUI();
    // 定时兜底：onaudioprocess 的节奏不稳，网慢的时候要有个地方重试积压的块
    micTimer = setInterval(flushMic, MIC_CHUNK_MS);
  }catch(e){
    await stopMic();
    micError(e.message || String(e));
  }finally{
    $('btnMic').disabled = false;
  }
}

async function stopMic(){
  if(!micRunning && !micStream) return;
  micRunning = false;
  clearInterval(micTimer); micTimer = null;

  if(micNode){ try{ micNode.disconnect(); }catch(_){} micNode = null; }
  if(micSink){ try{ micSink.disconnect(); }catch(_){} micSink = null; }
  if(micCtx){ try{ await micCtx.close(); }catch(_){} micCtx = null; }
  // 麦克风必须显式停轨：不停的话浏览器地址栏那个红点一直亮着，
  // 用户会以为还在录音，不知道该不该关页面。
  if(micStream){ for(const t of micStream.getTracks()) try{ t.stop(); }catch(_){} micStream = null; }

  micPending = [];
  // 先把剩下的音频冲出去再关连接，否则最后半句会被吞掉
  try{
    await fetch('/api/asr/stop', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ session: SESSION, role: myRole })
    });
  }catch(_){}
  syncMicUI();
}

function syncMicUI(){
  const b = $('btnMic');
  b.textContent = micRunning ? '● 正在说话（点这里暂停）' : '开始说话';
  b.className = 'micbtn' + (micRunning ? ' on' : '');
  $('micWho').textContent = myRole === 'interviewer' ? '我是面试官' : '我是面试者';
  $('micWho').className = 'pill' + (myRole === 'interviewer' ? ' warn' : '');
}

function micError(msg){
  addNotice(`麦克风用不了：${msg}`, true);
  flash('麦克风没开起来，看下面的提示');
  const h = $('micHint');
  h.innerHTML = `<b>开不了麦克风</b>：${esc(msg)}<br>
    手机上要用 https 打开（http 地址浏览器不给麦克风权限）；电脑上 localhost 可以。<br>
    实在不行就用上面的「模拟回放」，把要说的话粘进去。`;
}

$('btnMic').onclick = async () => {
  if(micRunning) await stopMic();
  else await startMic();
};

$('btnRole').onclick = async () => {
  if(micRunning) await stopMic();   // 换角色必须先停：音频要发到另一路去
  myRole = myRole === 'interviewer' ? 'candidate' : 'interviewer';
  localStorage.setItem('micRole', myRole);
  syncMicUI();
  flash(myRole === 'interviewer'
    ? '这台设备现在是【面试官】：你说的每句话会变成问题'
    : '这台设备现在是【面试者】：你说的话会喂给 AI 出题');
};

/* 中间结果和定稿都画在这一个框里。
   中间结果用完就丢、定稿才进对话流——两者混在一起会让「他已经说到哪了」
   变得看不出来。 */
function showLive(role, text){
  if(role !== myRole && text) return;   // 只显示自己这一路，别把别人的话也贴在自己框里
  const el = $('micShow');
  el.textContent = text || '';
  el.style.color = text ? 'var(--dim)' : '';
}

/* ── 面试官说的话 ──
   ★ 这里只画面试官，不画候选人：候选人的话已经在走 chunk 事件（appendSaid），
     再从 asr_line 画一遍就会同一句话出现两次。这个坑很隐蔽——
     两路来源都是「对的」，只是重复了。
   面试官的句子不进切块器（那不是回答），所以只有这一路。 */
function appendLine(line, replay){
  if(!line || !line.text) return;
  if(line.role !== 'interviewer') return;
  hideEmpty();

  let el = saidBlockEl.interviewer;
  if(!el || el.dataset.closed === '1'){
    el = document.createElement('div');
    el.className = 'saidblock q';
    const who = document.createElement('span');
    who.className = 'who';
    who.textContent = '面试官';
    el.appendChild(who);
    $('feed').appendChild(el);
    saidBlockEl.interviewer = el;
  }
  el.appendChild(document.createTextNode(line.text));

  // 面试官一开口，候选人那一段就该断了：下一句回答是新的一段
  if(saidEl) saidEl.dataset.closed = '1';

  scroll();
  // 他刚问出口的这句话直接填进输入框：多数时候不用改，回车就能记录。
  // 不自动提交——万一识别错一个字，自动记进去就污染了跨场记忆。
  if(!replay) $('question').value = line.text;
}

/* 轮询兜底：SSE 不通时对话流也要能补上来 */
function pollLines(transcript){
  const list = transcript || [];
  if(list.length < lineCount){ lineCount = 0; saidBlockEl.interviewer = null; }
  for(let i = lineCount; i < list.length; i++) appendLine(list[i], true);
  lineCount = list.length;
}


(async () => {
  connect();
  syncMicUI();
  try{
    const s = await (await fetch(`/api/state?s=${encodeURIComponent(SESSION)}`)).json();
    $('cfgBase').value = s.conf.baseUrl;
    $('cfgModel').value = s.conf.model;
    $('modelPill').textContent = s.conf.model + ' @ ' + s.conf.baseUrl.replace(/^https?:\/\//,'');

    /* 材料不再写死成「0 字」。
       以前这里硬写 '0 字'，于是服务重启、页面刷新之后，材料明明已经在
       服务端内存里、AI 也还在拿它出题，界面却显示「0 字」——看起来像材料
       丢了，人就会再粘一遍。现在按实际装载情况显示。 */
    let matLabel = '0 字';
    if(s.persisted && s.persisted.materialId){
      // 这一场挂着一份存过的材料：把正文拉回来填进框里
      try{
        const g = await (await fetch('/api/materials/get?id=' + s.persisted.materialId)).json();
        if(g.material){
          $('materials').value = g.material.text;
          matLabel = g.material.chars + ' 字 · 已恢复';
        }
      }catch(_){}
    }
    $('matStat').textContent = matLabel;

    /* 告诉用户在跨场记忆里有多少东西。
       这个数不显眼，但它是「AI 记得你之前面过」的唯一可见证据——
       没有它，人只能靠感觉猜这个功能到底有没有生效。 */
    if(s.persisted && s.persisted.priorAsked > 0){
      $('matStat').textContent += ` · 记得 ${s.persisted.priorAsked} 个旧问题`;
    }
    if(s.persisted && !s.persisted.enabled){
      $('matStat').textContent += ' · 未落盘';
    }
  }catch(e){
    $('connPill').textContent = '服务未启动';
    $('connPill').className = 'pill warn';
  }
  refreshState();
  setInterval(refreshState, 2000);
})();
</script>
